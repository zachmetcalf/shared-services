name: Standards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "America/Los_Angeles"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-standards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Standards
        shell: cmd
        run: scripts\standards\standards.bat

      - name: Record generation
        id: generation
        shell: pwsh
        run: |
          $base = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "base=$base" >> $env:GITHUB_OUTPUT
          "time=$([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss')) UTC" >> $env:GITHUB_OUTPUT

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SHARED_ACTIONS_TOKEN }}
          branch: automation/update-standards
          delete-branch: true
          commit-message: "[automation] #standards"
          title: "[automation] #standards"
          body: |
            Updated standards

            Generated: ${{ steps.generation.outputs.time }}
            Base commit: ${{ steps.generation.outputs.base }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
